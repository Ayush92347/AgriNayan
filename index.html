<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriNayan - AI Precision Farming & Bio-Economy Co-Pilot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        agri: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                            dark: '#071d0e',
                        },
                        earth: {
                            50: '#fffbe1',
                            100: '#fef3c7',
                            500: '#d97706',
                            700: '#92400e',
                            800: '#78350f',
                            dark: '#2a160d'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, .font-display { font-family: 'Outfit', sans-serif; }
        .pulse-mic { animation: pulseGlow 1.5s infinite; }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 18px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        body { padding-bottom: 75px; }
        @media (min-width: 768px) { body { padding-bottom: 0px; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-agri-500 selection:text-white min-h-screen flex flex-col custom-scrollbar">

    <!-- TOP BAR -->
    <header class="bg-agri-dark text-slate-300 text-xs py-2 px-3 sm:px-4 border-b border-agri-800/60 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-2 sm:space-x-3">
                <span class="inline-flex items-center text-emerald-400 font-bold text-[11px] sm:text-xs">
                    <i class="fa-solid fa-sparkles text-agri-500 mr-1.5"></i>
                    <span data-i18n="topTag">AgriNayan AI Co-Pilot</span>
                </span>
                <span class="hidden md:inline text-slate-700">|</span>
                <span class="hidden lg:inline-flex items-center text-slate-300">
                    <i class="fa-solid fa-phone text-agri-500 mr-1"></i>
                    <span data-i18n="helpline">Toll-Free Helpline: 1800-AGRI-NAYAN (1800-247-4620)</span>
                </span>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="speakCurrentSowingAlert()" class="flex items-center space-x-1 px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white transition text-xs font-bold shadow-sm">
                    <i class="fa-solid fa-volume-high animate-pulse"></i>
                    <span data-i18n="voiceBtn">Audio Alert</span>
                </button>

                <!-- DYNAMIC NATIVE 11-LANGUAGE SELECTOR -->
                <div class="flex items-center bg-slate-900 border border-emerald-500/60 rounded-lg px-2 py-1 shadow-md">
                    <i class="fa-solid fa-globe text-emerald-400 mr-1"></i>
                    <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-900 text-xs text-emerald-300 font-bold focus:outline-none cursor-pointer py-0.5 border-none">
                        <option value="en">English</option>
                        <option value="hinglish" selected>Hinglish</option>
                        <option value="hi">हिन्दी (Hindi)</option>
                        <option value="kn">ಕನ್ನಡ (Kannada)</option>
                        <option value="te">తెలుగు (Telugu)</option>
                        <option value="ta">தமிழ் (Tamil)</option>
                        <option value="mr">मराठी (Marathi)</option>
                        <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                        <option value="gu">ગુજરાતી (Gujarati)</option>
                        <option value="bn">বাংলা (Bengali)</option>
                        <option value="ml">മലയാളം (Malayalam)</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- NAVIGATION BAR -->
    <nav class="bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm sticky top-[37px] sm:top-[41px] z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('dashboard')">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-agri-500 to-agri-800 flex items-center justify-center text-white shadow-md shadow-agri-600/30">
                        <i class="fa-solid fa-sprout text-xl"></i>
                    </div>
                    <div>
                        <span class="font-display font-extrabold text-2xl tracking-tight text-agri-dark">Agri<span class="text-agri-600">Nayan</span></span>
                        <span class="block text-[10px] font-bold text-agri-700 tracking-wider uppercase" data-i18n="tagline">Precision Farming Co-Pilot</span>
                    </div>
                </div>

                <!-- DESKTOP NAVIGATION -->
                <div class="hidden md:flex space-x-1">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn px-3 py-2 rounded-xl text-xs font-semibold transition text-agri-700 bg-agri-50 border border-agri-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-chart-pie text-agri-600"></i> <span data-i18n="navDash">Dashboard</span>
                    </button>
                    <button onclick="switchTab('carefarm')" id="nav-carefarm" class="nav-btn px-3 py-2 rounded-xl text-xs font-medium transition text-slate-600 hover:text-agri-700 hover:bg-slate-50 flex items-center gap-1.5">
                        <i class="fa-solid fa-clipboard-check text-blue-600"></i> <span data-i18n="navCareFarm">View Care Farm</span>
                    </button>
                    <button onclick="switchTab('bioeconomy')" id="nav-bioeconomy" class="nav-btn px-3 py-2 rounded-xl text-xs font-medium transition text-slate-600 hover:text-agri-700 hover:bg-slate-50 flex items-center gap-1.5">
                        <i class="fa-solid fa-recycle text-amber-600"></i> <span data-i18n="navBioEconomy">Bio-Economy</span>
                    </button>
                    <button onclick="switchTab('agribazaar')" id="nav-agribazaar" class="nav-btn px-3 py-2 rounded-xl text-xs font-medium transition text-slate-600 hover:text-agri-700 hover:bg-slate-50 flex items-center gap-1.5">
                        <i class="fa-solid fa-store text-purple-600"></i> <span data-i18n="navBazaar">AgriBazaar</span>
                    </button>
                    <button onclick="switchTab('schemes')" id="nav-schemes" class="nav-btn px-3 py-2 rounded-xl text-xs font-medium transition text-slate-600 hover:text-agri-700 hover:bg-slate-50 flex items-center gap-1.5">
                        <i class="fa-solid fa-building-columns text-indigo-600"></i> <span data-i18n="navSchemes">Govt Schemes</span>
                    </button>
                    <button onclick="switchTab('tutorial')" id="nav-tutorial" class="nav-btn px-3 py-2 rounded-xl text-xs font-medium transition text-slate-600 hover:text-agri-700 hover:bg-slate-50 flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-question text-teal-600"></i> <span data-i18n="navTutorial">Website Guide</span>
                    </button>
                </div>

                <div class="hidden sm:flex items-center space-x-2">
                    <button onclick="openVoiceModal()" class="bg-gradient-to-r from-agri-600 to-agri-800 hover:from-agri-700 hover:to-agri-900 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow-md transition flex items-center gap-1.5 border border-emerald-400/40">
                        <i class="fa-solid fa-microphone text-emerald-300 animate-pulse"></i>
                        <span data-i18n="speakQuestion">AgriNayan Bol</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN APP CONTENT -->
    <main class="flex-grow">

        <!-- QUICK DEMO FARMER BAR -->
        <div class="bg-amber-50/90 border-b border-amber-200/80 py-2.5 px-4">
            <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
                <div class="flex items-center space-x-2.5">
                    <div class="w-7 h-7 rounded-full bg-amber-500 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div>
                        <span class="font-bold text-slate-900 text-xs" data-i18n="demoBarTitle">Quick Test Mode:</span>
                        <span class="text-xs text-slate-600 ml-1 hidden sm:inline" data-i18n="demoBarSub">Click to pre-fill sample farm data for Ramesh Kumar (Rampur, UP).</span>
                    </div>
                </div>
                <button onclick="loadDemoFarmerData()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition flex items-center gap-1.5">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span data-i18n="btnLoadDemo">Load Demo Farmer Data</span>
                </button>
            </div>
        </div>

        <!-- DASHBOARD TAB -->
        <section id="tab-dashboard" class="tab-content py-4 sm:py-6 max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 space-y-4 sm:space-y-6">
            
            <div class="relative bg-gradient-to-r from-agri-dark via-agri-900 to-earth-dark rounded-2xl sm:rounded-3xl p-5 sm:p-8 text-white shadow-xl overflow-hidden border border-agri-700/50">
                <div class="relative z-10 flex flex-col lg:flex-row justify-between items-start lg
